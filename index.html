<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luyện đọc</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand fw-semibold" href="#">Luyện đọc.</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
          aria-controls="mainNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav mx-lg-auto gap-lg-2 mb-3 mb-lg-0">
            <li class="nav-item">
              <button class="nav-link nav-screen-btn active" data-screen="settings" type="button">
                Thiết đặt hệ thống
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link nav-screen-btn" data-screen="practice" type="button">
                Thực hành
              </button>
            </li>
          </ul>

          <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-outline-secondary" id="themeToggleBtn" type="button">
              Chế độ tối
            </button>
            <button class="btn btn-outline-primary" id="exportBackupBtn" type="button">
              Xuất backup
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container-fluid py-3 py-lg-4 px-3 px-lg-4">
      <section id="settingsScreen" class="screen-section">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-2 mb-3">
              <div class="btn-toolbar gap-2">
                <button class="btn btn-primary" id="addWordBtn" type="button">Thêm từ mới</button>
                <button class="btn btn-outline-danger" id="clearAllBtn" type="button">Xóa tất cả</button>
              </div>

              <button class="btn btn-outline-secondary" id="timingSettingsBtn" type="button">
                Cài đặt thời gian hiển thị
              </button>
            </div>

            <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-2 mb-3 small text-secondary">
              <div id="selectionSummary">Đang chọn 0 dòng. Nếu có chọn, phần Thực hành sẽ dùng các dòng này.</div>
              <div class="btn-group btn-group-sm" role="group">
                <button class="btn btn-outline-secondary" id="editSelectedBtn" type="button" disabled>
                  Sửa dòng chọn
                </button>
                <button class="btn btn-outline-danger" id="deleteSelectedBtn" type="button" disabled>
                  Xóa dòng chọn
                </button>
              </div>
            </div>

            <div class="table-responsive">
              <table class="table align-middle mb-0" id="recordsTable">
                <thead class="table-light">
                  <tr>
                    <th class="col-select">
                      <input class="form-check-input" type="checkbox" id="selectAllRows" />
                    </th>
                    <th>Chữ đầu</th>
                    <th>Vần</th>
                    <th>Chữ</th>
                    <th>Đọc được</th>
                    <th>Không đọc được</th>
                  </tr>
                </thead>
                <tbody id="recordsTableBody"></tbody>
              </table>
            </div>

            <div class="text-secondary small mt-3 d-none" id="emptyTableState">
              Chưa có record nào. Hãy bấm "Thêm từ mới".
            </div>
          </div>
        </div>
      </section>

      <section id="practiceScreen" class="screen-section d-none">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
              <button class="btn btn-primary" id="startPracticeBtn" type="button">Bắt đầu</button>
              <button class="btn btn-outline-secondary" id="resetPracticeBtn" type="button">Đặt lại</button>
            </div>

            <div class="small text-secondary mb-3" id="practiceInfo">
              Chưa có dữ liệu luyện tập.
            </div>

            <div class="practice-stage-wrap border rounded-4 bg-white d-flex flex-column justify-content-center align-items-center mb-3">
              <div class="practice-stage-label text-secondary small mb-2" id="stageLabel">Sẵn sàng</div>
              <div class="practice-stage-display" id="stageDisplay"></div>
            </div>

            <div class="d-flex flex-wrap gap-2 justify-content-center">
              <button class="btn btn-success practice-result-btn" data-result="correct" type="button" disabled>
                Đọc được
              </button>
              <button class="btn btn-danger practice-result-btn" data-result="wrong" type="button" disabled>
                Không đọc được
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="modal fade" id="recordModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="recordForm">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="recordModalTitle">Thêm từ mới</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="editId" />

              <div class="mb-3">
                <label class="form-label">Chữ đầu</label>
                <input type="text" class="form-control" id="initialInput" maxlength="20" />
              </div>

              <div class="mb-3">
                <label class="form-label">Vần</label>
                <input type="text" class="form-control" id="rhymeInput" maxlength="20" />
              </div>

              <div>
                <label class="form-label">Chữ</label>
                <input type="text" class="form-control" id="wordInput" maxlength="60" />
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
              <button type="submit" class="btn btn-primary" id="saveRecordBtn">Lưu</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="timingModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="timingForm">
            <div class="modal-header">
              <h1 class="modal-title fs-5">Cài đặt thời gian hiển thị</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label">Giây chữ đầu</label>
                <input type="number" class="form-control" id="initialSecondsInput" min="0.2" step="0.1" />
              </div>

              <div class="mb-3">
                <label class="form-label">Giây ẩn</label>
                <input type="number" class="form-control" id="hideSecondsInput" min="0.1" step="0.1" />
              </div>

              <div>
                <label class="form-label">Giây vần</label>
                <input type="number" class="form-control" id="rhymeSecondsInput" min="0.2" step="0.1" />
              </div>

              <div class="mt-3">
                <label class="form-label">Giây từ</label>
                <input type="number" class="form-control" id="wordSecondsInput" min="0.2" step="0.1" />
              </div>

              <hr class="my-4" />

              <div class="row g-3 align-items-end">
                <div class="col-12 col-md-6">
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="autoRunToggle" />
                    <label class="form-check-label" for="autoRunToggle">Tự chạy</label>
                  </div>
                </div>

                <div class="col-12 col-md-6">
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="shuffleToggle" />
                    <label class="form-check-label" for="shuffleToggle">Shuffle</label>
                  </div>
                </div>

                <div class="col-12 col-md-4">
                  <label class="form-label">Hiện trước</label>
                  <select class="form-select" id="orderFirstSelect">
                    <option value="initial">Chữ đầu</option>
                    <option value="rhyme">Vần</option>
                    <option value="word">Từ</option>
                  </select>
                </div>

                <div class="col-12 col-md-4">
                  <label class="form-label">Hiện thứ 2</label>
                  <select class="form-select" id="orderSecondSelect">
                    <option value="initial">Chữ đầu</option>
                    <option value="rhyme">Vần</option>
                    <option value="word">Từ</option>
                  </select>
                </div>

                <div class="col-12 col-md-4">
                  <label class="form-label">Hiện thứ 3</label>
                  <select class="form-select" id="orderThirdSelect">
                    <option value="initial">Chữ đầu</option>
                    <option value="rhyme">Vần</option>
                    <option value="word">Từ</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
              <button type="submit" class="btn btn-primary">Lưu thời gian</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
